<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="Proposed application and data architecture"><title>Proposed application and data architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52617A"/></marker></defs><rect width="100%" height="100%" fill="#F5F7FB"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172238}.heading{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:14px;fill:#52617A}.box{fill:white;stroke:#CBD3DF;stroke-width:1.5}.edge{stroke:#52617A;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text class="heading" x="28" y="36">Independent platform • proposed architecture</text><rect class="box" x="28" y="70" width="270" height="120" rx="10"/><text class="label" x="44" y="100">Next.js web / BFF</text><text class="note" x="44" y="126">Workspace + staff + public sites</text><text class="note" x="44" y="148">OIDC session, verified site resolution</text><rect class="box" x="380" y="70" width="350" height="120" rx="10"/><text class="label" x="396" y="100">NestJS modular API</text><text class="note" x="396" y="126">SaaS · CRM · CMS · Marketing · IDX</text><text class="note" x="396" y="148">Reports · AI · support · integrations</text><rect class="box" x="812" y="70" width="280" height="120" rx="10"/><text class="label" x="828" y="100">Isolated workers</text><text class="note" x="828" y="126">Outbox · delivery · MLS · publishing</text><text class="note" x="828" y="148">Tenant context rechecked per job</text><path class="edge" d="M298,130 L380,130"/><path class="edge" d="M730,130 L812,130"/><rect class="box" x="28" y="270" width="300" height="120" rx="10"/><text class="label" x="44" y="300">PostgreSQL + PostGIS</text><text class="note" x="44" y="326">Canonical data, RLS, durable jobs</text><text class="note" x="44" y="348">Composite tenant keys + transactions</text><rect class="box" x="410" y="270" width="300" height="120" rx="10"/><text class="label" x="426" y="300">Redis + private object storage</text><text class="note" x="426" y="326">Wakeups, scoped cache, rate limits</text><text class="note" x="426" y="348">Scanned media; licensed derivatives</text><rect class="box" x="792" y="270" width="300" height="120" rx="10"/><text class="label" x="808" y="300">Provider adapters</text><text class="note" x="808" y="326">MLS modes · email · SMS · billing</text><text class="note" x="808" y="348">OIDC · AI · maps · optional local</text><path class="edge" d="M550,190 L178,270"/><path class="edge" d="M590,190 L560,270"/><path class="edge" d="M950,190 L945,270"/><text class="note" x="28" y="440">Managed deployment: OCI containers • secret manager • CDN • telemetry • backups • distinct migration/runtime identities</text></svg>