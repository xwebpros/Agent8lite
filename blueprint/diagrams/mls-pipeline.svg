<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="MLS adapter capability and licensing pipeline"><title>MLS adapter capability and licensing pipeline</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52617A"/></marker></defs><rect width="100%" height="100%" fill="#F5F7FB"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172238}.heading{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:14px;fill:#52617A}.box{fill:white;stroke:#CBD3DF;stroke-width:1.5}.edge{stroke:#52617A;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text class="heading" x="28" y="36">MLS integration • policy governs every derived surface</text><rect class="box" x="28" y="70" width="300" height="128" rx="10"/><text class="label" x="44" y="100">M1 contract / M5 mock</text><text class="note" x="44" y="126">Owner-approved provider at M6</text><text class="note" x="44" y="148">Discover capabilities + policy</text><text class="note" x="44" y="170">Unknown rights → deny</text><rect class="box" x="410" y="70" width="300" height="128" rx="10"/><text class="label" x="426" y="100">Adapter transport</text><text class="note" x="426" y="126">Replication: durable change pages</text><text class="note" x="426" y="148">Live query: bounded provider requests</text><text class="note" x="426" y="170">Embed: licensed UI, no assumed storage</text><rect class="box" x="792" y="70" width="300" height="128" rx="10"/><text class="label" x="808" y="100">Normalize + validate</text><text class="note" x="808" y="126">Feed-scoped source keys / statuses</text><text class="note" x="808" y="148">Field whitelist, attribution, expiry</text><text class="note" x="808" y="170">Synthetic data rejected in live mode</text><path class="edge" d="M328,133 L410,133"/><path class="edge" d="M710,133 L792,133"/><rect class="box" x="28" y="290" width="300" height="112" rx="10"/><text class="label" x="44" y="320">Read/alert policy gate</text><text class="note" x="44" y="346">Current display + address + freshness</text><text class="note" x="44" y="368">Licensed cache/media/alerts/AI use</text><text class="note" x="44" y="390">Revocation blocks and invalidates</text><rect class="box" x="410" y="290" width="300" height="112" rx="10"/><text class="label" x="426" y="320">Serving surfaces</text><text class="note" x="426" y="346">Search · details · map · CMS blocks</text><text class="note" x="426" y="368">Visitor organizer → CRM inquiry</text><text class="note" x="426" y="390">Consent-aware listing alerts</text><rect class="box" x="792" y="290" width="300" height="112" rx="10"/><text class="label" x="808" y="320">Sync + reconciliation</text><text class="note" x="808" y="346">Upsert / delete → committed page</text><text class="note" x="808" y="368">Advance opaque checkpoint last</text><text class="note" x="808" y="390">Retry, dedupe, monitor, reconcile</text><path class="edge" d="M945,198 L945,290"/><path class="edge" d="M945,402 V438 H178 V402"/><path class="edge" d="M328,365 L410,365"/><text class="note" x="28" y="455">No live feed, proprietary data, provider assumptions or credentials are included in this blueprint.</text></svg>