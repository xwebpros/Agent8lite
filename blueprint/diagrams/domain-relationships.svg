<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="Grouped domain relationships; full entity diagram in schema.mmd"><title>Grouped domain relationships; full entity diagram in schema.mmd</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52617A"/></marker></defs><rect width="100%" height="100%" fill="#F5F7FB"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172238}.heading{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:14px;fill:#52617A}.box{fill:white;stroke:#CBD3DF;stroke-width:1.5}.edge{stroke:#52617A;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text class="heading" x="28" y="36">Domain relationships • every business record is tenant-scoped</text><rect class="box" x="28" y="65" width="290" height="105" rx="10"/><text class="label" x="44" y="95">Identity + organization</text><text class="note" x="44" y="121">User → membership → role / office</text><text class="note" x="44" y="143">Plan → subscription → entitlement</text><rect class="box" x="408" y="65" width="300" height="105" rx="10"/><text class="label" x="424" y="95">CRM</text><text class="note" x="424" y="121">Contact → lead → deal / task / note</text><text class="note" x="424" y="143">Lead source, consent, activity, routing</text><rect class="box" x="798" y="65" width="294" height="105" rx="10"/><text class="label" x="814" y="95">Marketing</text><text class="note" x="814" y="121">Campaign → immutable version → steps</text><text class="note" x="814" y="143">Lead → enrollment → action → attempt</text><rect class="box" x="28" y="270" width="290" height="112" rx="10"/><text class="label" x="44" y="300">CMS + public identity</text><text class="note" x="44" y="326">Site → document → revision</text><text class="note" x="44" y="348">Domain, media, form → submission</text><text class="note" x="44" y="370">Site → visitor → saved search/favorite</text><rect class="box" x="408" y="270" width="300" height="112" rx="10"/><text class="label" x="424" y="300">Property + MLS</text><text class="note" x="424" y="326">Feed → listing → media</text><text class="note" x="424" y="348">Feed → run → checkpoint</text><text class="note" x="424" y="370">Listing + saved search → alert match</text><rect class="box" x="798" y="270" width="294" height="112" rx="10"/><text class="label" x="814" y="300">Shared execution + reporting</text><text class="note" x="814" y="326">Outbox / inbox / jobs / idempotency</text><text class="note" x="814" y="348">Audit, daily metrics, AI jobs</text><text class="note" x="814" y="370">Support grants, local profiles</text><path class="edge" d="M318,115 L408,115"/><path class="edge" d="M708,115 L798,115"/><path class="edge" d="M170,170 L170,270"/><path class="edge" d="M318,325 L408,325"/><path class="edge" d="M558,270 L558,170"/><path class="edge" d="M798,325 L708,325"/><text class="note" x="28" y="440">Arrows show service relationships; exact PK/FK cardinality and all 72 tables are in data/schema.sql and data/schema.mmd.</text></svg>