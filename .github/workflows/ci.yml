name: Synthetic application acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: estate
          POSTGRES_PASSWORD: local-migration-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d estate"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # IDX acceptance never changes roles or fixtures on the application's cluster.
      idx-postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: idx-migration-only
        ports: ["127.0.0.1:54434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Dedicated to the BullMQ acceptance: it must be isolated from application traffic.
      redis-acceptance:
        image: redis:7.4.6-alpine
        ports: ["56380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DEV_AUTH_ENABLED: 'true'
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://estate_runtime:local-runtime-only@127.0.0.1:55432/estate
      MIGRATION_DATABASE_URL: postgresql://postgres:local-migration-only@127.0.0.1:55432/estate
      CONTROL_DATABASE_URL: postgresql://estate_control:local-control-only@127.0.0.1:55432/estate
      STAFF_ISSUER_DATABASE_URL: postgresql://estate_staff_issuer:local-staff-issuer-only@127.0.0.1:55432/estate
      REDIS_URL: redis://127.0.0.1:56379
      MLS_PROVIDER: mock
      DELIVERY_PROVIDER: no-delivery
      IDX_TEST_SERVICE_CONTAINER: ${{ job.services.idx-postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-contracts.mjs --generated
      - run: pnpm db:verify-fresh
      - run: pnpm db:migrate
      - run: node scripts/local-control-identities.mjs
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Hosted launch and read-only preflight boundaries
        run: |
          pnpm exec vitest run --config scripts/vitest.launch.config.mts
          pnpm exec vitest run --config scripts/hosting/vitest.config.mts
      - name: Source-package bootstrap boundaries
        run: pnpm exec vitest run --config scripts/bootstrap/vitest.config.mts
      - run: pnpm build
      - run: pnpm verify:runtime
      - name: Compiled API fixture-mode and production-denial smoke
        run: pnpm verify:runtime:local
      - name: Assigned-port application and isolated hosted-demo smoke
        run: pnpm verify:launch:local
      - run: pnpm dev > /tmp/estate-dev.log 2>&1 &
      - name: Await synthetic servers
        run: node scripts/wait-ready.mjs
      - run: pnpm test:isolated
      - name: BullMQ transport with dedicated synthetic Redis
        run: pnpm exec vitest run --config tests/recovery/redis-service.vitest.config.mts
        env:
          REQUIRED_REDIS: redis://127.0.0.1:56380
          REQUIRED_REDIS_ISOLATED: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-acceptance-failures
          path: |
            test-results/
            playwright-report/
            /tmp/estate-dev.log
