<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proposed-title proposed-desc" viewBox="0 0 1100 835"><title id="proposed-title">Proposed independent rebuild architecture</title><desc id="proposed-desc">A proposed architecture, not the original system: web application, identity, modular API, tenant database, workers, contracted services, content storage and reporting.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68788e"/></marker></defs><style>rect{fill:#eef5ff;stroke:#709ad0;stroke-width:1.5}.inference rect{fill:#fff6e9;stroke:#ba863e;stroke-dasharray:6 4}.unknown rect{fill:#f4f5f7;stroke:#8791a0;stroke-dasharray:4 4}.node-title{font:600 16px system-ui;fill:#162b48;text-anchor:middle}.node-sub{font:12px system-ui;fill:#3a4c63;text-anchor:middle}.edge{stroke:#68788e;stroke-width:1.6;fill:none}.edge.inferred{stroke-dasharray:6 5}.edge-label{font:11px system-ui;fill:#53647c;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><path d="M 285 85 L 395 85" class="edge " marker-end="url(#arrow)"/><text x="340" y="77" class="edge-label">OIDC</text><path d="M 535 130 L 535 205" class="edge " marker-end="url(#arrow)"/><text x="535" y="159.5" class="edge-label">authenticated requests</text><path d="M 535 320 L 535 410" class="edge " marker-end="url(#arrow)"/><text x="535" y="357" class="edge-label">tenant-scoped data</text><path d="M 705 265 L 790 265" class="edge " marker-end="url(#arrow)"/><text x="747.5" y="257" class="edge-label">outbox / jobs</text><path d="M 930 315 L 930 420" class="edge " marker-end="url(#arrow)"/><text x="930" y="359.5" class="edge-label">adapter calls</text><path d="M 790 465 L 705 290" class="edge " marker-end="url(#arrow)"/><text x="747.5" y="369.5" class="edge-label">webhook inbox</text><path d="M 380 270 L 280 270" class="edge " marker-end="url(#arrow)"/><text x="330" y="262" class="edge-label">CMS / media</text><path d="M 140 310 L 140 420" class="edge " marker-end="url(#arrow)"/><text x="140" y="357" class="edge-label">assets / content</text><path d="M 535 505 L 535 595" class="edge " marker-end="url(#arrow)"/><text x="535" y="542" class="edge-label">aggregate events</text><path d="M 790 650 L 710 650" class="edge " marker-end="url(#arrow)"/><text x="750" y="642" class="edge-label">telemetry</text><path d="M 280 450 L 365 300" class="edge " marker-end="url(#arrow)"/><text x="322.5" y="367" class="edge-label">lead intake</text><path d="M 535 695 L 535 735" class="edge " marker-end="url(#arrow)"/><text x="535" y="707" class="edge-label">operational review</text><g class="confirmed"><rect x="25" y="45" width="260" height="85" rx="12"/><text x="155" y="70" class="node-title">Managed identity</text><text x="155" y="92" class="node-sub">OIDC + MFA</text><text x="155" y="110" class="node-sub">Tenant membership in application</text></g><g class="confirmed"><rect x="395" y="45" width="280" height="85" rx="12"/><text x="535" y="70" class="node-title">Next.js application</text><text x="535" y="92" class="node-sub">Portal · CRM · customer site</text><text x="535" y="110" class="node-sub">Accessible shared design system</text></g><g class="confirmed"><rect x="365" y="205" width="340" height="115" rx="12"/><text x="535" y="230" class="node-title">NestJS modular backend</text><text x="535" y="252" class="node-sub">Tenancy · entitlements · CRM</text><text x="535" y="270" class="node-sub">Sites · campaigns · billing · support</text><text x="535" y="288" class="node-sub">Versioned APIs + provider adapters</text></g><g class="confirmed"><rect x="790" y="215" width="280" height="100" rx="12"/><text x="930" y="240" class="node-title">Workflow workers</text><text x="930" y="262" class="node-sub">Outbox + scheduled jobs + retries</text><text x="930" y="280" class="node-sub">Durable campaigns / reconciliation</text><text x="930" y="298" class="node-sub">Temporal when complexity warrants</text></g><g class="confirmed"><rect x="25" y="230" width="255" height="80" rx="12"/><text x="152.5" y="255" class="node-title">CMS + media service</text><text x="152.5" y="277" class="node-sub">Managed WordPress or block CMS</text><text x="152.5" y="295" class="node-sub">Signed uploads / design editor</text></g><g class="confirmed"><rect x="25" y="420" width="255" height="85" rx="12"/><text x="152.5" y="445" class="node-title">Customer website / assets</text><text x="152.5" y="467" class="node-sub">Object storage + CDN + licensed IDX</text><text x="152.5" y="485" class="node-sub">Versioned site publication</text></g><g class="confirmed"><rect x="365" y="410" width="340" height="95" rx="12"/><text x="535" y="435" class="node-title">PostgreSQL</text><text x="535" y="457" class="node-sub">Tenant keys + policy enforcement</text><text x="535" y="475" class="node-sub">Leads · activity · tasks · campaigns</text><text x="535" y="493" class="node-sub">Subscription and provider mappings</text></g><g class="confirmed"><rect x="790" y="420" width="280" height="95" rx="12"/><text x="930" y="445" class="node-title">Contracted services</text><text x="930" y="467" class="node-sub">IDX · Yext · Stripe · email / SMS</text><text x="930" y="485" class="node-sub">Unlayer · calendar · DNS</text><text x="930" y="503" class="node-sub">Secret references + webhook inbox</text></g><g class="confirmed"><rect x="365" y="595" width="345" height="100" rx="12"/><text x="537.5" y="620" class="node-title">Analytics and reporting</text><text x="537.5" y="642" class="node-sub">Versioned metric definitions</text><text x="537.5" y="660" class="node-sub">Source + time window + freshness</text><text x="537.5" y="678" class="node-sub">Materialized tenant aggregates</text></g><g class="confirmed"><rect x="790" y="600" width="280" height="95" rx="12"/><text x="930" y="625" class="node-title">Observability</text><text x="930" y="647" class="node-sub">Traces · errors · worker lag</text><text x="930" y="665" class="node-sub">Provider health + delivery status</text></g><g class="confirmed"><rect x="365" y="735" width="345" height="75" rx="12"/><text x="537.5" y="760" class="node-title">Staff administration</text><text x="537.5" y="782" class="node-sub">Scoped access + reason + audit trail</text><text x="537.5" y="800" class="node-sub">Support / provisioning / reconciliation</text></g></svg>